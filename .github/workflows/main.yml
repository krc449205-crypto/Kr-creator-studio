name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packages
        run: npm install

      - name: Make www folder
        run: |
          mkdir -p www
          cp index.html www/

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add notification permissions
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perm = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>'
          s = s.replace('<application', perm + '<application', 1)
          open(p, 'w').write(s)
          EOF

      - name: Make green G app icon from code
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 - <<'EOF'
          import math, struct, zlib

          def inside_sq(u, v):
              ax = abs(u - 0.5); ay = abs(v - 0.5); r = 0.22
              if ax > 0.5 or ay > 0.5:
                  return False
              if ax > 0.5 - r and ay > 0.5 - r and math.hypot(ax - (0.5 - r), ay - (0.5 - r)) > r:
                  return False
              return True

          def is_g(u, v):
              dx = u - 0.5; dy = v - 0.5
              d = math.hypot(dx, dy)
              ang = math.degrees(math.atan2(dy, dx))
              if 0.19 <= d <= 0.32 and not (-65 <= ang <= 5):
                  return True
              if 0.52 <= u <= 0.72 and 0.44 <= v <= 0.54:
                  return True
              if 0.62 <= u <= 0.72 and 0.44 <= v <= 0.72:
                  return True
              return False

          def color(u, v):
              if is_g(u, v):
                  return (12, 34, 12)
              t = v
              return (150 + (30 - 150) * t, 255 + (200 - 255) * t, 90 + (50 - 90) * t)

          def render(s):
              SS = 3
              rows = bytearray()
              for y in range(s):
                  rows.append(0)
                  for x in range(s):
                      R = G = B = 0; n = 0
                      for j in range(SS):
                          for i in range(SS):
                              u = (x + (i + 0.5) / SS) / s
                              v = (y + (j + 0.5) / SS) / s
                              if inside_sq(u, v):
                                  c = color(u, v)
                                  R += c[0]; G += c[1]; B += c[2]; n += 1
                      if n:
                          rows += bytes([int(R / n), int(G / n), int(B / n), int(255 * n / (SS * SS))])
                      else:
                          rows += bytes([0, 0, 0, 0])
              return bytes(rows)

          def write_png(path, s, raw):
              def chunk(t, data):
                  c = struct.pack('>I', len(data)) + t + data
                  return c + struct.pack('>I', zlib.crc32(t + data) & 0xffffffff)
              data = (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', s, s, 8, 6, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(raw, 9))
                      + chunk(b'IEND', b''))
              open(path, 'wb').write(data)

          RES = 'android/app/src/main/res'
          for d, s in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              raw = render(s)
              write_png(RES + '/mipmap-' + d + '/ic_launcher.png', s, raw)
              write_png(RES + '/mipmap-' + d + '/ic_launcher_round.png', s, raw)
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
