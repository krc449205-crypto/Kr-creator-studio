name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packages
        run: npm install

      - name: Make www folder
        run: |
          mkdir -p www
          cp index.html www/

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add notification permissions
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perm = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>'
          s = s.replace('<application', perm + '<application', 1)
          open(p, 'w').write(s)
          EOF
      - name: Make 1 second alarm sound
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'EOF'
          import math, struct, wave
          rate = 44100
          frames = bytearray()
          n = int(rate * 1.0)
          for i in range(n):
              t = i / rate
              f = 1000 if (int(t * 8) % 2 == 0) else 1400
              env = min(1.0, t * 40, (1.0 - t) * 15)
              v = int(32767 * 0.8 * env * math.sin(2 * math.pi * f * t))
              frames += struct.pack('<h', v)
          w = wave.open('android/app/src/main/res/raw/alarm_beep.wav', 'wb')
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
          w.writeframes(bytes(frames)); w.close()
          EOF
      - name: Make arrow app icon from code
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 - <<'EOF'
          import math, struct, zlib

          def pip(x, y, poly):
              inside = False
              n = len(poly)
              j = n - 1
              for i in range(n):
                  xi, yi = poly[i]
                  xj, yj = poly[j]
                  if (yi > y) != (yj > y) and x < (xj - xi) * (y - yi) / (yj - yi + 1e-12) + xi:
                      inside = not inside
                  j = i
              return inside

          ARROW = [(-0.30,-0.06),(0.00,-0.06),(0.00,-0.17),(0.30,0.0),(0.00,0.17),(0.00,0.06),(-0.30,0.06)]
          C = math.sqrt(0.5)

          def inside_sq(u, v):
              ax = abs(u - 0.5); ay = abs(v - 0.5); r = 0.22
              if ax > 0.5 or ay > 0.5:
                  return False
              if ax > 0.5 - r and ay > 0.5 - r and math.hypot(ax - (0.5 - r), ay - (0.5 - r)) > r:
                  return False
              return True

          def is_arrow(u, v):
              dx = u - 0.5; dy = v - 0.5
              lx = dx * C - dy * C
              ly = dx * C + dy * C
              return pip(lx, ly, ARROW)

          def color(u, v):
              if is_arrow(u, v):
                  return (12, 34, 12)
              t = v
              return (150 + (30 - 150) * t, 255 + (200 - 255) * t, 90 + (50 - 90) * t)

          def render(s):
              SS = 3
              rows = bytearray()
              for y in range(s):
                  rows.append(0)
                  for x in range(s):
                      R = G = B = 0; n = 0
                      for j in range(SS):
                          for i in range(SS):
                              u = (x + (i + 0.5) / SS) / s
                              v = (y + (j + 0.5) / SS) / s
                              if inside_sq(u, v):
                                  c = color(u, v)
                                  R += c[0]; G += c[1]; B += c[2]; n += 1
                      if n:
                          rows += bytes([int(R / n), int(G / n), int(B / n), int(255 * n / (SS * SS))])
                      else:
                          rows += bytes([0, 0, 0, 0])
              return bytes(rows)

          def write_png(path, s, raw):
              def chunk(t, data):
                  c = struct.pack('>I', len(data)) + t + data
                  return c + struct.pack('>I', zlib.crc32(t + data) & 0xffffffff)
              data = (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', s, s, 8, 6, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(raw, 9))
                      + chunk(b'IEND', b''))
              open(path, 'wb').write(data)

          RES = 'android/app/src/main/res'
          for d, s in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              raw = render(s)
              write_png(RES + '/mipmap-' + d + '/ic_launcher.png', s, raw)
              write_png(RES + '/mipmap-' + d + '/ic_launcher_round.png', s, raw)
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
