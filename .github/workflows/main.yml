name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: npm install

      - name: Make www folder
        run: |
          mkdir -p www
          cp index.html www/

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add notification permissions
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perm = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>'
          s = s.replace('<application', perm + '<application', 1)
          open(p, 'w').write(s)
          EOF

      - name: Set app icon from uploaded logo
        run: |
          pip install pillow
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 - <<'EOF'
          import glob, os
          from PIL import Image

          files = [f for f in glob.glob('*.png') if os.path.getsize(f) > 1000]
          if not files:
              raise SystemExit('Repo ke root mein logo PNG nahi mili')

          im = Image.open(files[0]).convert('RGBA')
          mask = im.convert('L').point(lambda p: 255 if p > 60 else 0)
          box = mask.getbbox()
          if box:
              im = im.crop(box)
          w, h = im.size
          side = int(max(w, h) * 1.25)
          sq = Image.new('RGBA', (side, side), (5, 5, 5, 255))
          sq.paste(im, ((side - w) // 2, (side - h) // 2), im)

          RES = 'android/app/src/main/res'
          for d, s in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              out = sq.resize((s, s), Image.LANCZOS).convert('RGB')
              out.save(RES + '/mipmap-' + d + '/ic_launcher.png')
              out.save(RES + '/mipmap-' + d + '/ic_launcher_round.png')
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
