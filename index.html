<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KR Reminder</title>
<style>
  body{background:#111;color:#fff;font-family:sans-serif;padding:20px}
  h2{margin-top:0}
  input,button{width:100%;box-sizing:border-box;padding:14px;margin:6px 0;border-radius:10px;border:none;font-size:16px}
  input{background:#222;color:#fff}
  button{background:#6c3cf7;color:#fff}
  .item{background:#1c1c1c;padding:10px;border-radius:10px;margin:6px 0}
  .del{background:#a33;padding:8px;width:auto;margin:6px 0 0 0}
  #status{margin:10px 0;color:#9f9}
</style>
</head>
<body>
<h2>KR Reminder</h2>
<button id="perm">1. Permission do</button>
<input id="title" placeholder="Reminder ka title (jaise Video upload karo)">
<input id="when" type="datetime-local">
<button id="set">2. Reminder set karo</button>
<div id="status">Status: abhi kuch nahi hua</div>
<h3>Set kiye hue reminders</h3>
<div id="list"></div>

<script>
var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
var st = document.getElementById('status');
function say(t){ st.textContent = 'Status: ' + t; }

function load(){ try{ return JSON.parse(localStorage.getItem('rem')||'[]'); }catch(e){ return []; } }
function save(a){ localStorage.setItem('rem', JSON.stringify(a)); }

function draw(){
  var l = document.getElementById('list');
  l.innerHTML = '';
  var a = load();
  if(!a.length){ l.textContent = 'Koi reminder nahi'; return; }
  a.forEach(function(r){
    var d = document.createElement('div');
    d.className = 'item';
    d.textContent = r.title + ' - ' + new Date(r.time).toLocaleString();
    var b = document.createElement('button');
    b.className = 'del';
    b.textContent = 'Delete';
    b.onclick = function(){ del(r.id); };
    d.appendChild(b);
    l.appendChild(d);
  });
}

async function del(id){
  try{
    if(LN) await LN.cancel({notifications:[{id:id}]});
    save(load().filter(function(r){ return r.id !== id; }));
    draw();
    say('reminder delete ho gaya');
  }catch(e){ say('delete error: ' + e.message); }
}

document.getElementById('perm').onclick = async function(){
  if(!LN){ say('plugin nahi mila (APK mein chalao)'); return; }
  try{
    var r = await LN.requestPermissions();
    say('permission: ' + r.display);
  }catch(e){ say('permission error: ' + e.message); }
};

document.getElementById('set').onclick = async function(){
  if(!LN){ say('plugin nahi mila (APK mein chalao)'); return; }
  var title = document.getElementById('title').value.trim();
  var w = document.getElementById('when').value;
  if(!title){ say('pehle title likho'); return; }
  if(!w){ say('pehle date aur time chuno'); return; }
  var t = new Date(w);
  if(t.getTime() <= Date.now()){ say('time aage ka chuno'); return; }
  var id = Math.floor(Date.now() % 2000000000);
  try{
    await LN.schedule({notifications:[{
      id:id, title:'KR Creator Studio', body:title,
      schedule:{at:t, allowWhileIdle:true}
    }]});
    var a = load(); a.push({id:id, title:title, time:t.getTime()}); save(a);
    draw();
    say('reminder set ho gaya: ' + t.toLocaleString());
  }catch(e){ say('set error: ' + e.message); }
};

draw();
</script>
</body>
</html>
